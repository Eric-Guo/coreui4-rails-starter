---
image: cimg/ruby:4.0.9-browsers

variables:
  RAILS_ENV: test
  HEADLESS: "1"
  SE_CHROMEDRIVER: /usr/local/bin/chromedriver
  CACHE_FALLBACK_KEY: "$CI_COMMIT_REF_SLUG"

before_script:
  - bundle config set path 'vendor' # Install dependencies into ./vendor/ruby
  - |
    if ! command -v pnpm >/dev/null; then
      if command -v corepack >/dev/null; then
        corepack enable
        corepack prepare pnpm@11.25.0 --activate
      elif command -v npm >/dev/null; then
        npm install -g pnpm@11.25.0
      else
        echo 'pnpm is required but neither corepack nor npm is available.' >&2
        exit 1
      fi
    fi
  - |
    # Match the image's Chrome build and bypass Selenium Manager's runtime downloads.
    chrome_version=$(google-chrome --product-version)
    driver_version=$(curl --fail --silent --show-error --location --retry 3 \
      "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_${chrome_version%.*}")
    driver_dir=$(mktemp -d)
    curl --fail --silent --show-error --location --retry 3 \
      "https://storage.googleapis.com/chrome-for-testing-public/${driver_version}/linux64/chromedriver-linux64.zip" \
      --output "$driver_dir/chromedriver.zip"
    unzip -q "$driver_dir/chromedriver.zip" -d "$driver_dir"
    sudo install -m 0755 "$driver_dir/chromedriver-linux64/chromedriver" "$SE_CHROMEDRIVER"
    rm -rf "$driver_dir"
    google-chrome --version
    chromedriver --version

stages:
  - test

test:
  stage: test
  cache:
    - key:
        files:
          - Gemfile.lock
      paths:
        - vendor/ruby
  script:
    - bundle install -j $(nproc)
    - pnpm install --frozen-lockfile
    - bundle exec standardrb
    - bin/rails db:drop RAILS_ENV=test
    - bin/rails db:setup RAILS_ENV=test
    - bin/rails test
    - bin/rails test:system
  only:
    - main
    - merge_requests
