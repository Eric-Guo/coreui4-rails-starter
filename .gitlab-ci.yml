---
image: cimg/ruby:4.0.9-browsers

variables:
  RAILS_ENV: test
  HEADLESS: "1"
  CACHE_FALLBACK_KEY: "$CI_COMMIT_REF_SLUG"

before_script:
  - bundle config set path 'vendor' # Install dependencies into ./vendor/ruby
  - |
    if ! command -v pnpm >/dev/null; then
      if command -v corepack >/dev/null; then
        corepack enable
        corepack prepare pnpm@11.25.0 --activate
      elif command -v npm >/dev/null; then
        npm install -g pnpm@11.25.0
      else
        echo 'pnpm is required but neither corepack nor npm is available.' >&2
        exit 1
      fi
    fi

stages:
  - test

test:
  stage: test
  cache:
    - key:
        files:
          - Gemfile.lock
      paths:
        - vendor/ruby
  script:
    - bundle install -j $(nproc)
    - pnpm install --frozen-lockfile
    - bundle exec standardrb
    - bin/rails db:drop RAILS_ENV=test
    - bin/rails db:setup RAILS_ENV=test
    - bin/rails test
    - bin/rails test:system
  only:
    - main
    - merge_requests
